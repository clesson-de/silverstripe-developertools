    TOAST_HINT: 'Overlays display information, warnings or alerts above the website content, for example maintenance notices or important announcements. Visibility can be restricted by environment, IP addresses, user groups (including subgroups) and an optional start/end date and time. All configured filters apply together. Position, automatic dismissal and the close button can be configured individually.'
