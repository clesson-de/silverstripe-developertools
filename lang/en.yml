    IP_HELP: 'These addresses retain access to the normal website. Separate entries with commas or new lines. Examples: 192.0.2.1, 192.0.2.0/24, 2001:db8::/32, 192.0.2.10-192.0.2.20.'
    HINT: 'Database builds create and publish the single Offline page with English starter content if none exists. Edit it in the page tree and publish changes to refresh its standalone static HTML. Enabling offline mode serves this document with HTTP 503 at the requested URL, including APIs and monitoring. Start and end are optional; start is inclusive and end exclusive. Only the listed IP addresses bypass the gate, including for logged-in administrators. The admin area, login and required resources remain reachable. Purge or bypass existing website/CDN caches when enabling this feature. PHP, Silverstripe and the settings database must remain operational.'
