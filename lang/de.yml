  Clesson\Silverstripe\DeveloperTools\Forms\OfflineModeTab:
    TITLE: 'Offline-Modus'
    IP_HELP: 'Diese Adressen dürfen die normale Website weiterhin aufrufen. Einträge durch Kommas oder Zeilenumbrüche trennen. Beispiele: 192.0.2.1, 192.0.2.0/24, 2001:db8::/32, 192.0.2.10-192.0.2.20.'
    HINT: 'Beim Datenbankaufbau wird die einmalige Offline-Seite mit englischem Standardinhalt angelegt und veröffentlicht, sofern noch keine vorhanden ist. Die Seite im Seitenbaum bearbeiten und Änderungen veröffentlichen, um ihr eigenständiges statisches HTML zu aktualisieren. Der aktive Offline-Modus liefert dieses Dokument unter der angefragten URL mit HTTP 503 aus, auch für APIs und Monitoring. Start und Ende sind optional; der Start ist eingeschlossen, das Ende ausgeschlossen. Nur eingetragene IP-Adressen umgehen die Sperre, auch bei angemeldeten Administratoren. Adminbereich, Anmeldung und notwendige Ressourcen bleiben erreichbar. Beim Aktivieren vorhandene Website-/CDN-Caches leeren oder umgehen. PHP, Silverstripe und die Einstellungsdatenbank müssen weiterhin funktionieren.'
