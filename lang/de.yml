  Clesson\Silverstripe\DeveloperTools\Models\DeveloperToolsConfig:
    MONITORING_HINT_TITLE: 'Webseiten-Monitoring'
    MONITORING_HINT: 'Das Monitoring bietet eine Übersicht über Ihre Webseiten, deren Erreichbarkeit, Software-Versionen und Systemprüfungen. Zusätzlich wird geprüft, ob HTTP direkt auf HTTPS weiterleitet; nicht erreichbare HTTP-Endpunkte gelten als nicht bewertbar. Unter Konfiguration verwalten Sie die überwachten Webseiten, unter Info sehen Sie die Prüfergebnisse und unter Benachrichtigungen richten Sie E-Mail-Zusammenfassungen ein.'
    TOAST_HINT_TITLE: 'Overlays auf der Webseite'
    TOAST_HINT: 'Overlays zeigen Informationen, Warnungen oder Alarme über dem Webseiteninhalt an, zum Beispiel Wartungshinweise oder wichtige Ankündigungen. Die Sichtbarkeit lässt sich nach Umgebung, IP-Adressen, Benutzergruppen (einschließlich Untergruppen) und einem optionalen Start- und Enddatum mit Uhrzeit einschränken. Alle gesetzten Filter gelten gemeinsam. Position, automatisches Ausblenden und der Schließen-Button lassen sich individuell festlegen.'
    TAB_NOTIFICATIONS: 'Benachrichtigungen'
    NOTIFY_MEMBERS: 'Benachrichtigungsempfänger'
    NOTIFICATION_HELP: 'Benutzer auswählen, die pro automatischem Durchlauf eine Zusammenfassung an ihre aktuelle E-Mail-Adresse erhalten. Keine Mail bei manuellen Prüfungen. Eine leere Auswahl deaktiviert den Versand. Die Auswahl vergibt keine CMS-Berechtigungen.'
